name: Uncut Gem V1 — Generate 10 official subsystem crops
on:
  push:
    branches: [main]
    paths:
      - 'code/scripts/BuildUncutGemV1Subsystems.py'
      - '.github/workflows/LCR_SUBSYSTEMS_V1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uncugem-v1-subsystems-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Create 10 conservative crops from genuine Quantum Village sources
        run: python code/scripts/BuildUncutGemV1Subsystems.py
      - name: Validate ten PNGs, ZIP and manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('code/public/assets/official/v1/subsystems')
          manifest=json.loads((p/'SubsystemsManifest.json').read_text())
          assert len(manifest['subsystems'])==10
          for s in manifest['subsystems']:
              path=p/s['file']
              assert path.exists()
              with Image.open(path) as im:
                  im.verify()
              print('CHECK',s['id'],path.name)
          assert (p/'UgV1SubsystemsBundle.zip').exists()
          PY
      - name: Commit sources and 10 processed PNGs
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/public/assets/official/v1/subsystems
          if ! git diff --cached --quiet; then
            git commit -m "assets(v1): publish 10 source-verified subsystem images"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: UncutGemV1TenSubsystems
          path: code/public/assets/official/v1/subsystems/UgV1SubsystemsBundle.zip
          if-no-files-found: error
