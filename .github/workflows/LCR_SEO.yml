name: LCR SEO — verificações básicas
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'code/public/**'
      - 'code/src/**'
      - 'code/scripts/lcr_seo.py'
      - '.github/workflows/LCR_SEO.yml'
  push:
    paths:
      - 'code/public/**'
      - 'code/src/**'
      - 'code/scripts/lcr_seo.py'
      - '.github/workflows/LCR_SEO.yml'
  schedule:
    - cron: '31 11 * * 1' # semanal
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar estrutura SEO
        run: python code/scripts/lcr_seo.py