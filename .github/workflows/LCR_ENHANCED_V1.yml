name: LCR — gerar recortes fotográficos oficiais V1
on:
  push:
    branches: [main]
    paths:
      - 'code/scripts/enhance_uncut_gem_v1.py'
      - '.github/workflows/LCR_ENHANCED_V1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Criar PNGs e validar imagem original
        run: python code/scripts/enhance_uncut_gem_v1.py
      - name: Publicar recortes oficiais sem alterar a fonte
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/public/assets/official/v1/enhanced
          if git diff --cached --quiet; then
            echo "Recortes já atualizados"
          else
            git commit -m "assets(v1): add conservative official photo crops"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: uncugem-v1-crops-enhanced
          path: code/public/assets/official/v1/enhanced/ug-v1-recortes-aprimorados.zip
          if-no-files-found: error
