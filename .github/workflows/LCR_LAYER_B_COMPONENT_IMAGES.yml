name: NV Virtual Lab — Layer B official component images
on:
  push:
    branches: [main]
    paths:
      - 'code/scripts/BuildLayerBComponentImages.py'
      - 'code/public/data/LayerBComponentImagePlan.json'
      - '.github/workflows/LCR_LAYER_B_COMPONENT_IMAGES.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nv-layer-b-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install conservative image processing
        run: python -m pip install 'Pillow==11.3.0'
      - name: Generate all 69 Layer B statuses, 61 evidence-based PNGs
        run: python code/scripts/BuildLayerBComponentImages.py
      - name: Verify generated files and preserve Layer A
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('code/public/assets/official/v1/components')
          plan=json.loads(Path('code/public/data/LayerBComponentImagePlan.json').read_text())
          ck=json.loads(Path('documentation/agents-archive/planner/artifacts/ComponentImageCheckpoint.json').read_text())
          items=ck['items']
          assert len(items)==len(plan['components'])==69
          assert sum(x['status']=='CHECK' for x in items)==61
          assert sum(x['status']=='REVISÃO' for x in items)==8
          assert all(x['tag'].startswith('UG-V1-') and not x['tag'].startswith('UG-V1-S') for x in items)
          for x in items:
              if x['status']=='CHECK':
                  path=p/x['image']
                  assert path.is_file(), path
                  with Image.open(path) as im:
                      im.verify()
          assert (p/'UgV1LayerBComponents.zip').is_file()
          assert Path('code/public/assets/official/v1/subsystems/UgV1SubsystemAdf4351.png').is_file()
          print('CHECK 69/69; 61 PNGs; 8 review; zero Layer A modifications')
          PY
      - name: Commit only generated Layer B files and checkpoint
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/public/assets/official/v1/components/ documentation/agents-archive/planner/artifacts/ComponentImageCheckpoint.json
          if git diff --cached --quiet; then
            echo "Layer B files already up to date"
          else
            git commit -m "assets(v1): publish Layer B component crops and audit checkpoint"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: UncutGemV1LayerBComponentImages
          path: code/public/assets/official/v1/components/UgV1LayerBComponents.zip
          if-no-files-found: error
