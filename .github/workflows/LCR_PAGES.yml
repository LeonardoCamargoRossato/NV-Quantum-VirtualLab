name: LCR Pages — V1
on:
  push:
    branches: [main]
    paths: ['code/**', '.github/workflows/LCR_PAGES.yml']
  pull_request:
    paths: ['code/**', '.github/workflows/LCR_PAGES.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.inventory.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: code
      - run: python code/scripts/consolidate_inventory.py --check
      - run: npm test && npm run build
        working-directory: code
      - run: python -m unittest discover -s code/tests -p 'test_*.py' -v
      - name: Verificar prontidão do inventário
        id: inventory
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data = json.load(open('code/source/InventoryV1.json'))
          tags = [item['tag'] for item in data['items']]
          ready = data['status'] == 'validated' and len(tags) == len(set(tags)) == 79 and sum(i['layer'] == 'A' for i in data['items']) == 10 and sum(i['layer'] == 'B' for i in data['items']) == 69 and bool(data.get('snapshotAt')) and bool(data.get('sourceSha256'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publishable=' + str(ready).lower() + '\n')
          print('Inventário validado; publicação permitida.' if ready else 'Publicação pendente: validar catálogo canônico de 79 registros.')
          PY
      - name: Verificar recortes fotográficos no pacote que será publicado
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('code/public/assets/official/v1/enhanced')
          dest = Path('code/dist/assets/official/v1/enhanced')
          manifest = json.loads((source / 'EnhancedCropsManifest.json').read_text(encoding='utf-8'))
          expected = [entry['filename'] for entry in manifest['crops']]
          if len(expected) != 11 or len(set(expected)) != len(expected):
              raise SystemExit('Manifesto incorreto: são esperados 11 PNGs únicos')
          errors = []
          for name in expected:
              original, deployed = source / name, dest / name
              if not original.is_file() or not deployed.is_file():
                  errors.append(f'{name}: ausente no repositório ou no dist')
              elif original.stat().st_size != deployed.stat().st_size:
                  errors.append(f'{name}: tamanho divergente')
              elif deployed.read_bytes()[:8] != bytes([137,80,78,71,13,10,26,10]):
                  errors.append(f'{name}: cabeçalho PNG inválido')
          if errors:
              raise SystemExit('Erro de publicação de imagens: ' + '; '.join(errors))
          print(f'CHECK: {len(expected)} PNGs presentes e íntegros em code/dist')
          PY
      - uses: actions/upload-pages-artifact@v3
        if: steps.inventory.outputs.publishable == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: code/dist
  deploy:
    needs: build
    if: needs.build.outputs.publishable == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-public-assets:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verificar os 11 PNGs no endereço público do GitHub Pages
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          manifest = json.loads(Path('code/public/assets/official/v1/enhanced/EnhancedCropsManifest.json').read_text(encoding='utf-8'))
          names = [row['filename'] for row in manifest['crops']]
          base = 'https://leonardocamargorossato.github.io/NV-Quantum-VirtualLab/assets/official/v1/enhanced/'
          signature = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          errors = []
          for attempt in range(1, 9):
              errors.clear()
              for name in names:
                  url = base + name
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'NVLab-CI/1.0'}), timeout=18) as response:
                          if response.status != 200 or signature != response.read(8):
                              errors.append(f'{name}: HTTP {response.status} ou PNG inválido')
                  except (HTTPError, URLError, TimeoutError) as exc:
                      errors.append(f'{name}: {type(exc).__name__}')
              if not errors:
                  print(f'CHECK PUBLIC PAGES: {len(names)} PNGs carregados em {base}')
                  break
              print(f'Tentativa {attempt}/8: {len(errors)} imagens ainda indisponíveis; esperando propagação')
              if attempt < 8:
                  time.sleep(8)
          if errors:
              raise SystemExit('Recortes não publicados: ' + '; '.join(errors))
          PY
