name: LCR Backup — central e automatico para projetos publicos
on:
  workflow_dispatch:
  schedule:
    # 23:55 America/Sao_Paulo (UTC-3), na noite do dia anterior.
    - cron: '55 2 * * *'
permissions:
  contents: read
jobs:
  backup:
    if: ${{ vars.LCR_DRIVE_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar regras de elegibilidade
        run: python -m unittest discover -s code/tests -p 'test_lcr_central_backup.py' -v
      - name: Verificar credenciais existentes
        env:
          DRIVE_TOKEN: ${{ secrets.LCR_DRIVE_OAUTH_TOKEN }}
          DRIVE_FOLDER: ${{ vars.LCR_DRIVE_FOLDER_ID }}
          CLIENT_ID: ${{ secrets.LCR_DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.LCR_DRIVE_CLIENT_SECRET }}
        run: |
          test -n "$DRIVE_TOKEN" || exit 1
          test -n "$DRIVE_FOLDER" || exit 1
          test -n "$CLIENT_ID" || exit 1
          test -n "$CLIENT_SECRET" || exit 1
      - name: Instalar rclone no servidor GitHub
        run: sudo apt-get update -qq && sudo apt-get install -y rclone
      - name: Descobrir e espelhar projetos iniciados com LCR_START
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          RCLONE_CONFIG_LCRDRIVE_TYPE: drive
          RCLONE_CONFIG_LCRDRIVE_SCOPE: drive
          RCLONE_CONFIG_LCRDRIVE_TOKEN: ${{ secrets.LCR_DRIVE_OAUTH_TOKEN }}
          RCLONE_CONFIG_LCRDRIVE_CLIENT_ID: ${{ secrets.LCR_DRIVE_CLIENT_ID }}
          RCLONE_CONFIG_LCRDRIVE_CLIENT_SECRET: ${{ secrets.LCR_DRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_LCRDRIVE_ROOT_FOLDER_ID: ${{ vars.LCR_DRIVE_FOLDER_ID }}
        run: python code/scripts/lcr_central_backup.py
